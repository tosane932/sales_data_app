name: Deploy DPT to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "logistics/driver-personality-test/**"
      - ".github/workflows/dpt-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Check JavaScript syntax
        run: |
          node --check logistics/driver-personality-test/app.js
          node --check logistics/driver-personality-test/db.js
          node --check logistics/driver-personality-test/testData.js

      - name: Build DPT Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          dpt_source="logistics/driver-personality-test"
          dpt_target="_site/logistics/driver-personality-test"
          required_files=(
            index.html
            style.css
            app.js
            db.js
            testData.js
            demo01.jpg
          )

          mkdir -p "$dpt_target"

          for file in "${required_files[@]}"; do
            test -f "$dpt_source/$file"
            cp "$dpt_source/$file" "$dpt_target/$file"
          done

          touch _site/.nojekyll
          test ! -e _site/store
          test ! -e _site/information

      - name: Run HTTP smoke check
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 8000 \
            --bind 127.0.0.1 \
            --directory _site \
            >/tmp/dpt-pages-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          base_url="http://127.0.0.1:8000/logistics/driver-personality-test"
          curl --fail --silent --show-error \
            --retry 5 --retry-connrefused --retry-delay 1 \
            "$base_url/" \
            --output /tmp/dpt-pages-index.html
          curl --fail --silent --show-error \
            "$base_url/style.css?v=20260710" --output /dev/null
          curl --fail --silent --show-error \
            "$base_url/app.js?v=20260710" --output /dev/null
          curl --fail --silent --show-error \
            "$base_url/db.js" --output /dev/null
          curl --fail --silent --show-error \
            "$base_url/testData.js" --output /dev/null
          grep --fixed-strings "運転性格診断スタート" \
            /tmp/dpt-pages-index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
