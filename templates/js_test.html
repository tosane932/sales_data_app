<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JavaScript動的魔術の実験場</title>
</head>
<body style="background: #f5edd6; font-family: sans-serif; padding: 50px; text-align: center;">

    <h1 style="color: #4a3c31;">🧙‍♂️ JavaScript非同期魔術の実験場</h1>
    
    <p id="magic-text" style="font-size: 30px; font-weight: bold; color: #8b5a1a; margin: 40px 0;">
        ここはまだ普通の文字じゃ。
    </p>

    <button onclick="castMagic()" style="padding: 15px 30px; font-size: 18px; font-weight: bold; background: #8b5a1a; color: white; border: none; border-radius: 8px; cursor: pointer;">
        画面をリロードせずに文字を変える呪文
    </button>

    <script>
        function castMagic() {
            const textElement = document.getElementById('magic-text');
            
            textElement.innerHTML = "🌀 画面の裏でPythonと通信中...";
            textElement.style.color = "#8b5a1a";

            // 🌟 画面リロードなしで Flask の窓口（/api/get-secret-data）へ突撃！
            fetch('/api/get-secret-data')
                .then(response => response.json())  // 送られてきたデータをJSONとして解析
                .then(data => {
                    // 🌟 Pythonから届いたメッセージ（data.message）を画面にドーン！
                    textElement.innerHTML = `✨ Pythonからデータ受信成功！ ✨<br><br>${data.message}`;
                    textElement.style.color = "#1e88e5"; // 綺麗なブルーにチェンジ！
                })
                .catch(error => {
                    textElement.innerHTML = "🚨 通信エラーが発生したぞ！";
                    textElement.style.color = "#d32f2f";
                });
        }
    </script>
</body>
</html>
