<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>売上集計完了</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #fcfaf7;
            color: #4a3c31;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 480px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(139, 92, 26, 0.05);
            margin: 0 auto;
            border: 1px solid #f1ebd9;
            text-align: center;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 20px;
            color: #8b5a1a;
            margin: 0 0 25px;
        }
        .info-box {
            background: #faf8f5;
            border: 1px solid #f1ebd9;
            color: #6e543c;
            font-size: 14px;
            line-height: 1.6;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-home {
            background-color: #f7eed6;
            color: #8b5a1a;
            border: 1px solid #ebdcb9;
        }
        .btn-home:hover {
            background-color: #ebdcb9;
        }
        .btn-dashboard {
            background-color: #e74c3c;
            color: #ffffff;
        }
        .btn-dashboard:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">✅</div>
    <h1>売上シートの保存が完了しました</h1>

    <div class="info-box">
        データは安全にシステムへ取り込まれました。<br>
        引き続き日々の数量入力をお願いします。
    </div>

    <div class="actions">
        <a href="/" class="btn btn-home">🍞 入力画面に戻る</a>
        <a href="/dashboard" class="btn btn-dashboard">🔴 お店の健康診断書を見る</a>
    </div>
</div>

</body>
</html>
