<form method="GET" action="{{ search_action }}" class="shop-memo-search-form" role="search">
    <input type="hidden" name="sort" value="{{ sort_by }}">
    <label for="memo-search" class="shop-memo-search-label">
        メモを検索
    </label>

    <div class="shop-memo-search-input-wrap">
        <button
            type="submit"
            class="shop-memo-search-icon-button"
            aria-label="検索">
            <svg
                data-icon="search"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                focusable="false"
                aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
        </button>

        <input
            id="memo-search"
            name="q"
            type="search"
            value="{{ search_query }}"
            placeholder="メモを検索"
            maxlength="100"
            autocomplete="off">

        <button
            id="memo-search-clear"
            type="button"
            class="shop-memo-search-clear"
            aria-label="検索文字をすべて消す"
            data-clear-url="{{ clear_url }}"
            {% if not search_query %}hidden{% endif %}>
            <span aria-hidden="true">×</span>
        </button>
    </div>
</form>

{% if search_query %}
<p class="shop-memo-search-result" role="status">
    「{{ search_query }}」の検索結果：{{ memos|length }}件
</p>
{% endif %}
