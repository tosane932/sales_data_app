<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}店舗メモツール{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="shop-tools-page app-shell-page">
{% include "_app_navigation.html" %}
<div class="shop-tools-shell">
    <header class="shop-tools-header">
        <p class="shop-tools-brand">
            <span aria-hidden="true">📝</span> 店舗メモツール
        </p>
        <h1>{% block tool_heading %}{% endblock %}</h1>
    </header>

    <main class="shop-tools-content" id="shop-tools-content">
        {% block content %}{% endblock %}
    </main>
</div>

<nav class="shop-tools-bottom-nav" aria-label="店舗メモツールのメニュー">
    <a
        href="{{ url_for('material_orders.list_items') }}"
        data-tool="orders"
        class="shop-tools-nav-link{% if active_tool == 'orders' %} shop-tools-nav-link-current{% endif %}"
        {% if active_tool == 'orders' %}aria-current="page"{% endif %}>
        <span class="shop-tools-nav-icon" aria-hidden="true">🛒</span>
        <span>発注</span>
    </a>
    <a
        href="{{ url_for('shop_memos.list_memos') }}"
        data-tool="memo"
        class="shop-tools-nav-link{% if active_tool == 'memo' %} shop-tools-nav-link-current{% endif %}"
        {% if active_tool == 'memo' %}aria-current="page"{% endif %}>
        <span class="shop-tools-nav-icon" aria-hidden="true">📝</span>
        <span>メモ</span>
    </a>
    <a
        href="{{ url_for('shop_tools.tasks_placeholder') }}"
        data-tool="tasks"
        class="shop-tools-nav-link{% if active_tool == 'tasks' %} shop-tools-nav-link-current{% endif %}"
        {% if active_tool == 'tasks' %}aria-current="page"{% endif %}>
        <span class="shop-tools-nav-icon" aria-hidden="true">✅</span>
        <span>タスク</span>
    </a>
</nav>

{% block floating_action %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
