<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ベーカリー売上管理システム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script type="application/ld+json">
     {
       "@context": "https://schema.org",
       "@type": "Person",
       "name": "tosane932",
       "url": "tosane932のポートフォリオURL",
       "sameAs": [
       "https://github.com/tosane932",
       "https://qiita.com/tosane932"
       ]
     }
     </script>
</head>
<body>

<div class="container">
    <h1>🍞 ベーカリー売上管理システム</h1>
    {% if error %}
    <div style="background-color: #fff0f0; color: #c0392b; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #f5c6cb;">
        ⚠️ {{ error }}
    </div>
    {% endif %}
    
    <form method="POST">
        <div class="section">
            <div class="section-title">① 作成する年月を選択してください</div>
            <div class="select-group">
                <select name="year" id="year-select">
                    <option value="2026"
                        {% if selected_year == 2026 %}selected{% endif %}>
                        2026年
                    </option>

                    <option value="2027"
                        {% if selected_year == 2027 %}selected{% endif %}>
                        2027年
                    </option>
                    
                </select>
                <select name="month" id="month-select">
                    <option value="1" {% if selected_month == 1 %}selected{% endif %}>
                        1月{% if 1 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="2" {% if selected_month == 2 %}selected{% endif %}>
                        2月{% if 2 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="3" {% if selected_month == 3 %}selected{% endif %}>
                        3月{% if 3 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="4" {% if selected_month == 4 %}selected{% endif %}>
                        4月{% if 4 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="5" {% if selected_month == 5 %}selected{% endif %}>
                        5月{% if 5 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="6" {% if selected_month == 6 %}selected{% endif %}>
                        6月{% if 6 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="7" {% if selected_month == 7 %}selected{% endif %}>
                        7月{% if 7 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="8" {% if selected_month == 8 %}selected{% endif %}>
                        8月{% if 8 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="9" {% if selected_month == 9 %}selected{% endif %}>
                        9月{% if 9 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="10" {% if selected_month == 10 %}selected{% endif %}>
                        10月{% if 10 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="11" {% if selected_month == 11 %}selected{% endif %}>
                        11月{% if 11 in registered_months %} ✅{% endif %}
                    </option>
                    <option value="12" {% if selected_month == 12 %}selected{% endif %}>
                        12月{% if 12 in registered_months %} ✅{% endif %}
                    </option>
                </select>
            </div>
        </div>

        <div class="section">
            <div class="section-title">② 今月のメニューと価格（初日単価）を設定</div>
            <div class="menu-list" id="menu-container">
            
            {% if products %}

                {% for p in products %}
                <div class="menu-row">

                    <input type="hidden" name="product_id" value="{{ p.id }}">

                    <input
                        type="text"
                        name="prod_name"
                        class="input-name"
                        value="{{ p.name }}"
                        placeholder="商品名"
                        required>

                    <input
                        type="number"
                        name="prod_price"
                        class="input-price"
                        value="{{ p.price }}"
                        placeholder="単価"
                        min="0"
                        required>

                    <button
                        type="button"
                        class="btn btn-del"
                        onclick="removeRow(this)">
                        ✖
                    </button>
                </div>
                {% endfor %}

            {% else %}

                <div class="menu-row">
                    <input type="hidden" name="product_id" value="">
                    <input type="text" name="prod_name" class="input-name" value="食パン" placeholder="商品名" required>
                    <input type="number" name="prod_price" class="input-price" value="200" placeholder="単価" min="0" required>
                    <button type="button" class="btn btn-del" onclick="removeRow(this)">✖</button>
                </div>
                <div class="menu-row">
                    <input type="hidden" name="product_id" value="">
                    <input type="text" name="prod_name" class="input-name" value="メロンパン" placeholder="商品名" required>
                    <input type="number" name="prod_price" class="input-price" value="140" placeholder="単価" min="0" required>
                    <button type="button" class="btn btn-del" onclick="removeRow(this)">✖</button>
                </div>
                <div class="menu-row">
                    <input type="hidden" name="product_id" value="">
                    <input type="text" name="prod_name" class="input-name" value="クロワッサン" placeholder="商品名" required>
                    <input type="number" name="prod_price" class="input-price" value="120" placeholder="単価" min="0" required>
                    <button type="button" class="btn btn-del" onclick="removeRow(this)">✖</button>
                </div>
                <div class="menu-row">
                    <input type="hidden" name="product_id" value="">
                    <input type="text" name="prod_name" class="input-name" value="コロネ" placeholder="商品名" required>
                    <input type="number" name="prod_price" class="input-price" value="150" placeholder="単価" min="0" required>
                    <button type="button" class="btn btn-del" onclick="removeRow(this)">✖</button>
                </div>
                <div class="menu-row">
                    <input type="hidden" name="product_id" value="">
                    <input type="text" name="prod_name" class="input-name" value="ホットドッグ" placeholder="商品名" required>
                    <input type="number" name="prod_price" class="input-price" value="220" placeholder="単価" min="0" required>
                    <button type="button" class="btn btn-del" onclick="removeRow(this)">✖</button>
                </div>
            {% endif %}
            </div>
            <button type="button" class="btn btn-add" onclick="addRow()">＋ 新メニューを追加する</button>
        </div>

        <button type="submit" class="btn btn-submit">🚀 この内容で今月のメニューを登録する</button>
    </form>
</div>

<div style="margin: 20px 0; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; text-align: center;">
    <a href="/input" class="menu-link" style="font-size: 1.5rem; color: #c9a063; font-weight: bold;">
        📝 日次売上を入力する
    </a>
</div>

<div style="margin: 20px 0; padding: 15px; background: #f9f9f9; border: 1px solid #ddd; text-align: center;">
    <a href="/dashboard" class="menu-link" style="font-size: 1.5rem; color: #e74c3c; font-weight: bold;">
        📊お店の健康診断書（売上分析・ランキング）を見る
    </a>
    <p style="font-size:0.9rem; color:#777; text-align:center; margin-top:8px;">
        🤖 AIが店舗の健康診断を作成します。
        分析には5〜10秒ほどかかる場合があります。
    </p>
</div>

<script>
    // 🌟 パパっと追加・消去するための軽快なJavaScript
    function addRow() {
        const container = document.getElementById('menu-container');
        const div = document.createElement('div');
        div.className = 'menu-row';
        div.innerHTML = `
            <input type="hidden" name="product_id" value="">
            <input type="text" name="prod_name" class="input-name" placeholder="新商品名" required>
            <input type="number" name="prod_price" class="input-price" placeholder="単価" min="0" required>
            <button type="button" class="btn btn-del" onclick="removeRow(this)">✖</button>
        `;
        container.appendChild(div);
    }

    function removeRow(button) {
        const row = button.parentElement;
        row.parentElement.removeChild(row);
    }

    const yearSelect = document.getElementById("year-select");
    const monthSelect = document.getElementById("month-select");

    function loadMaster() {

        const year = yearSelect.value;
        const month = monthSelect.value;

        window.location.href =
            `/?year=${year}&month=${month}`;
    }

    yearSelect.addEventListener("change", loadMaster);
    monthSelect.addEventListener("change", loadMaster);

</script>
</body>
</html>
